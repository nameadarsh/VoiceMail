<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Email Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
            <h1>Voice Email Assistant</h1>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                <div class="flash-messages">
                    {% for message in messages %}
                        <div class="alert">{{ message }}</div>
                    {% endfor %}
                </div>
                {% endif %}
            {% endwith %}

        <div class="login-form">
            <form method="POST">
                <div class="form-group">
                    <label for="email">Gmail Address:</label>
                    <input type="email" id="email" name="email" required placeholder="your.email@gmail.com">
                </div>
                
                <div class="form-group">
                    <label for="password">App Password:</label>
                    <input type="password" id="password" name="password" required>
                    <small class="help-text">
                        Use an <a href="https://support.google.com/accounts/answer/185833" target="_blank">App Password</a> 
                        from your Google Account, not your regular password.
                    </small>
                </div>
                
                <button type="submit" class="primary-button">Login</button>
            </form>
        </div>
    </div>
</body>
</html>
